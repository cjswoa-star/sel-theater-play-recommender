name: Verify batch4

on:
  push:
    paths:
      - '.github/workflows/verify-batch4.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check curation-overrides.js
      - run: grep -q '보이지 않는 줄의 속도와 들어가는 타이밍' curation-overrides.js && grep -q '앞사람들이 말하거나 보여 준 항목의 순서를 유지하면서' curation-overrides.js && grep -q '8박 구조를 유지하면서' curation-overrides.js
      - run: rm .github/workflows/verify-batch4.yml
      - run: |
          git config user.name "cjswoa-star"
          git config user.email "cjswoa@goedu.kr"
          git add .github/workflows/verify-batch4.yml
          git commit -m "Remove one-time batch4 verification"
          git push
