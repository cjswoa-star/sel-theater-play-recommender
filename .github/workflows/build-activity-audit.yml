name: Build activity audit catalog

on:
  push:
    paths:
      - '.github/workflows/build-activity-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract compact catalog and structural audit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, collections

          text = Path('index.html').read_text(encoding='utf-8')
          m = re.search(r'window\.ACTIVITY_MASTER=(\{.*?\});\s*</script>', text, re.S)
          if not m:
              raise SystemExit('ACTIVITY_MASTER not found')
          master = json.loads(m.group(1))
          acts = master['activities']

          def sp(a): return a.get('source_preserved', {})
          def rn(a): return a.get('recommendation_normalized', {})
          def pd(a): return a.get('program_derived', {})
          def norm_title(s):
              return re.sub(r'[^0-9a-z가-힣]+','', (s or '').lower())

          catalog=[]
          for a in acts:
              s=sp(a); r=rn(a); p=pd(a)
              cc=s.get('class_conditions',{}); ap=s.get('activity_profile',{})
              catalog.append({
                  'id':a.get('activity_id'),'title':s.get('title'),'purpose_raw':s.get('activity_purpose_raw'),
                  'grade_raw':cc.get('grade_raw'),'time_raw':cc.get('time_raw'),'participants_raw':cc.get('participants_raw'),
                  'space_raw':cc.get('space_raw'),'materials_raw':cc.get('materials_raw'),
                  'activity_level_raw':ap.get('activity_level_raw'),'movement_level_raw':ap.get('movement_level_raw'),
                  'noise_level_raw':ap.get('noise_level_raw'),'contact_level_raw':ap.get('contact_level_raw'),
                  'collision_risk_raw':ap.get('collision_risk_raw'),'sel_connections':s.get('sel_connections_raw',[]),
                  'summary':s.get('summary_raw'),'procedure':s.get('procedure_raw',[]),'teacher_prompt':s.get('teacher_prompt_raw'),
                  'reflection':s.get('reflection_question_raw'),'safety':s.get('safety_notes_raw',[]),
                  'grade_min':r.get('grade_min'),'grade_max':r.get('grade_max'),'time_min':r.get('time_min'),'time_max':r.get('time_max'),
                  'participant_min':r.get('participant_min'),'participant_max':r.get('participant_max'),'participant_structure':r.get('participant_structure'),
                  'space_types':r.get('space_types',[]),'materials_required':r.get('materials_required'),'materials_optional':r.get('materials_optional'),
                  'materials_detail':r.get('materials_detail'),'activity_level':r.get('activity_level'),'movement_level':r.get('movement_level'),
                  'noise_level':r.get('noise_level'),'contact_level':r.get('contact_level'),'collision_risk':r.get('collision_risk'),
                  'purpose_tags':r.get('purpose_tags',[]),'sel_tags':r.get('sel_tags',[]),'recommendation_ready':r.get('recommendation_ready'),
                  'contact_constraint':p.get('contact_constraint'),'space_compatibility':p.get('space_compatibility',{}),
                  'safety_score':p.get('recommendation_features',{}).get('safety_score'),
                  'classroom_convenience':p.get('recommendation_features',{}).get('classroom_convenience'),
                  'mood_fit':p.get('mood_fit',{}),'energy_fit':p.get('energy_fit',{})
              })

          def count(field): return dict(collections.Counter(str(x.get(field)) for x in catalog))
          purpose_counts=collections.Counter(t for x in catalog for t in x['purpose_tags'])
          sel_counts=collections.Counter(t for x in catalog for t in x['sel_tags'])
          space_counts=collections.Counter(t for x in catalog for t in x['space_types'])
          title_groups=collections.defaultdict(list)
          for x in catalog: title_groups[norm_title(x['title'])].append(x['id'])
          exactish_dupes={k:v for k,v in title_groups.items() if k and len(v)>1}

          flags=[]
          for x in catalog:
              f=[]
              for key in ['title','summary','teacher_prompt','reflection']:
                  if not x.get(key): f.append('MISSING_'+key.upper())
              if not x['procedure']: f.append('MISSING_PROCEDURE')
              if not x['safety']: f.append('MISSING_SAFETY')
              if len(x['purpose_tags'])>=5: f.append('PURPOSE_TAGS_5_PLUS')
              if len(x['sel_tags'])>=4: f.append('SEL_TAGS_4_PLUS')
              mr=(x['materials_raw'] or '').strip()
              if mr in ('없음','없음.') and x['materials_required']: f.append('MATERIAL_CONTRADICTION')
              if x['contact_level_raw']=='없음' and x['contact_level'] not in (None,'NONE'): f.append('CONTACT_NORMALIZATION_CONTRADICTION')
              if x['contact_level']=='NONE' and x['contact_constraint'] not in (None,'NO_CONTACT_COMPATIBLE'): f.append('CONTACT_DERIVATION_CONTRADICTION')
              sc=x.get('space_compatibility') or {}
              if x['collision_risk']=='HIGH' and sc.get('CLASSROOM',0)>0: f.append('HIGH_COLLISION_CLASSROOM_COMPATIBLE')
              if x['movement_level']=='HIGH' and sc.get('CLASSROOM',0)>=0.8: f.append('HIGH_MOVEMENT_GENERAL_CLASSROOM')
              if isinstance(x['grade_min'],int) and isinstance(x['grade_max'],int) and x['grade_max']-x['grade_min']>=5: f.append('GRADE_SPAN_1_TO_6')
              if isinstance(x['time_max'],(int,float)) and x['time_max']<=7 and len(x['procedure'])>=5: f.append('SHORT_TIME_COMPLEX_STEPS')
              if x['collision_risk']=='HIGH' and len(x['safety'])<2: f.append('HIGH_RISK_SPARSE_SAFETY')
              if f: flags.append({'id':x['id'],'title':x['title'],'flags':f})

          summaries=collections.Counter((x['summary'] or '').strip() for x in catalog if x['summary'])
          prompts=collections.Counter((x['teacher_prompt'] or '').strip() for x in catalog if x['teacher_prompt'])
          reflections=collections.Counter((x['reflection'] or '').strip() for x in catalog if x['reflection'])
          sel_expl=collections.Counter(c.get('explanation','').strip() for x in catalog for c in x['sel_connections'] if c.get('explanation'))

          audit={
              'metadata':master.get('metadata',{}),'activity_count':len(catalog),
              'grade_min_distribution':count('grade_min'),'grade_max_distribution':count('grade_max'),
              'activity_level_distribution':count('activity_level'),'movement_level_distribution':count('movement_level'),
              'noise_level_distribution':count('noise_level'),'contact_level_distribution':count('contact_level'),
              'collision_risk_distribution':count('collision_risk'),'participant_structure_distribution':count('participant_structure'),
              'space_type_counts':dict(space_counts),'purpose_tag_counts':dict(purpose_counts.most_common()),'sel_tag_counts':dict(sel_counts.most_common()),
              'exact_or_punctuation_title_duplicates':exactish_dupes,'flag_count':len(flags),'flags':flags,
              'repeated_summary_top':[{'text':k,'count':v} for k,v in summaries.most_common(15) if v>1],
              'repeated_teacher_prompt_top':[{'text':k,'count':v} for k,v in prompts.most_common(15) if v>1],
              'repeated_reflection_top':[{'text':k,'count':v} for k,v in reflections.most_common(15) if v>1],
              'repeated_sel_explanation_top':[{'text':k,'count':v} for k,v in sel_expl.most_common(20) if v>1]
          }
          Path('audit').mkdir(exist_ok=True)
          Path('audit/activity_catalog.json').write_text(json.dumps(catalog,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('audit/structural_audit.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2),encoding='utf-8')
          print('activities',len(catalog),'flags',len(flags),'catalog bytes',Path('audit/activity_catalog.json').stat().st_size)
          PY
      - name: Commit audit outputs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/activity_catalog.json audit/structural_audit.json
          git commit -m 'Generate temporary activity audit data'
          git push
