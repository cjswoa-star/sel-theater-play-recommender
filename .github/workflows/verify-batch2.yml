name: Verify second curation batch

on:
  push:
    paths:
      - '.github/workflows/verify-batch2.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check curation JavaScript
        run: node --check curation-overrides.js
      - name: Check curation layer is loaded
        run: |
          grep -q '<script src="curation-overrides.js"></script>' index.html
          grep -q "'130':" curation-overrides.js
          grep -q "'120':" curation-overrides.js
      - name: Remove verification workflow
        run: rm .github/workflows/verify-batch2.yml
      - name: Commit cleanup
        run: |
          git config user.name "cjswoa-star"
          git config user.email "cjswoa@goedu.kr"
          git add .github/workflows/verify-batch2.yml
          git commit -m "Remove second batch verification workflow"
          git push
