name: Apply batch3 curation

on:
  push:
    paths:
      - '.github/workflows/apply-batch3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply batch3 curation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('curation-overrides.js')
          text = path.read_text(encoding='utf-8')

          rec_anchor = "    '099': {\n"
          if "    '007': {\n" not in text:
              rec_add = """    '007': {
      purposes: ['협력하기', '관찰하기', '비언어 소통']
    },
    '032': {
      purposes: ['협력하기', '비언어 소통', '문제 해결']
    },
    '051': {
      purposes: ['협력하기', '상상 열기', '비언어 소통']
    },
    '052': {
      purposes: ['관찰하기', '협력하기', '상상 열기']
    },
    '053': {
      purposes: ['관계 열기', '비언어 소통', '협력하기'],
      sel: ['사회적 인식', '관계 기술']
    },
    '058': {
      purposes: ['공간 인식', '관찰하기', '협력하기']
    },
    '059': {
      purposes: ['관찰하기', '관계 열기', '상상 열기']
    },
    '060': {
      purposes: ['상상 열기', '문제 해결', '협력하기']
    },
    '061': {
      purposes: ['관찰하기', '상상 열기', '협력하기']
    },
    '109': {
      purposes: ['비언어 소통', '관계 열기', '신체 인식']
    },
    '118': {
      purposes: ['상상 열기', '협력하기', '자기표현']
    },
    '125': {
      purposes: ['상상 열기', '문제 해결', '협력하기']
    },
    '126': {
      purposes: ['비언어 소통', '상상 열기', '문제 해결']
    },
    '140': {
      purposes: ['공간 인식', '관찰하기', '협력하기']
    },
"""
              if text.count(rec_anchor) != 1:
                  raise SystemExit(f'Expected recommendation anchor once, found {text.count(rec_anchor)}')
              text = text.replace(rec_anchor, rec_add + rec_anchor, 1)

          source_marker = "  const sourceEdits = {\n"
          if "      reflection_question_raw: '다른 사람의 행동을 보고 내가 들어가야 할 역할을 알아차린 순간은 언제였나요?'" not in text:
              source_add = """    '007': {
      reflection_question_raw: '다른 사람의 행동을 보고 내가 들어가야 할 역할을 알아차린 순간은 언제였나요?'
    },
    '032': {
      teacher_prompt_raw: '누가 이끌려고 하지 말고, 보이지 않는 물건의 무게나 방향이 바뀌면 모두가 같은 순간에 반응해 봅시다.',
      reflection_question_raw: '같은 보이지 않는 물건의 무게와 위치를 함께 유지하려면 누구의 어떤 움직임을 가장 많이 읽었나요?'
    },
    '051': {
      reflection_question_raw: '전체가 무엇인지 확실하지 않은 상태에서 새 부분을 더할 때 무엇을 보고 결정했나요?'
    },
    '109': {
      teacher_prompt_raw: '말 대신 발의 방향·거리·속도만으로 두 사람의 관계가 보이게 해 봅시다.',
      reflection_question_raw: '두 사람의 관계를 가장 분명하게 보여 준 발의 거리나 방향 변화는 무엇이었나요?'
    },
    '126': {
      teacher_prompt_raw: '비밀 단어나 음절을 말하지 않고, 각 장면의 행동이 관객에게 단서가 되게 보여 주세요.',
      reflection_question_raw: '관객이 비밀 단어를 떠올리게 한 몸짓이나 장면의 단서는 무엇이었나요?'
    },
"""
              if text.count(source_marker) != 1:
                  raise SystemExit(f'Expected source marker once, found {text.count(source_marker)}')
              text = text.replace(source_marker, source_marker + source_add, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify JavaScript syntax
        run: node --check curation-overrides.js
      - name: Verify batch3 ids
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('curation-overrides.js').read_text(encoding='utf-8')
          for aid in ['007','032','051','052','053','058','059','060','061','109','118','125','126','140']:
              assert f"    '{aid}': {{" in text, aid
          for phrase in [
              '다른 사람의 행동을 보고 내가 들어가야 할 역할을 알아차린 순간은 언제였나요?',
              '같은 보이지 않는 물건의 무게와 위치를 함께 유지하려면 누구의 어떤 움직임을 가장 많이 읽었나요?',
              '전체가 무엇인지 확실하지 않은 상태에서 새 부분을 더할 때 무엇을 보고 결정했나요?',
              '두 사람의 관계를 가장 분명하게 보여 준 발의 거리나 방향 변화는 무엇이었나요?',
              '관객이 비밀 단어를 떠올리게 한 몸짓이나 장면의 단서는 무엇이었나요?'
          ]:
              assert phrase in text, phrase
          print('PASS batch3')
          PY
      - name: Remove workflow
        run: rm .github/workflows/apply-batch3.yml
      - name: Commit batch3
        run: |
          git config user.name "cjswoa-star"
          git config user.email "cjswoa@goedu.kr"
          git add curation-overrides.js .github/workflows/apply-batch3.yml
          git diff --cached --quiet && exit 0
          git commit -m "Curate third batch of place relationship and improv activities"
          git push
