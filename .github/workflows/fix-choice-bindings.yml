name: Fix choice button bindings

on:
  push:
    paths:
      - '.github/workflows/fix-choice-bindings.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch energy and contact selectors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          fixes = {
              "#step2 .field:last-of-type .choice": "#step2 .field .choice",
              "#step3 .field:last-of-type .choice": "#step3 .field .choice",
          }
          for old, new in fixes.items():
              count = text.count(old)
              if count == 0:
                  raise SystemExit(f'Expected selector not found: {old}')
              print(f'{old} -> {new}: {count} occurrence(s)')
              text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix energy and contact choice buttons'
          git push
