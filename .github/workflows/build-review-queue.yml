name: Build semantic review queue

on:
  push:
    paths:
      - '.github/workflows/build-review-queue.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build review queue
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          cat=json.loads(Path('audit/activity_catalog.json').read_text(encoding='utf-8'))
          st=json.loads(Path('audit/structural_audit.json').read_text(encoding='utf-8'))
          flagged={x['id']:x['flags'] for x in st['flags']}
          review_ids=set(flagged)
          # add physical/general-game queue from deep audit
          deep=json.loads(Path('audit/deep_audit.json').read_text(encoding='utf-8'))
          review_ids.update(x['id'] for x in deep['physical_or_general_game_review'])
          rows=[]
          for x in cat:
              if x['id'] not in review_ids: continue
              rows.append({
                'id':x['id'],'title':x['title'],'flags':flagged.get(x['id'],[]),
                'purpose_tags':x['purpose_tags'],'sel_tags':x['sel_tags'],
                'grade':x['grade_raw'],'time':x['time_raw'],'participants':x['participants_raw'],
                'space':x['space_raw'],'materials':x['materials_raw'],
                'levels':{'activity':x['activity_level_raw'],'movement':x['movement_level_raw'],'noise':x['noise_level_raw'],'contact':x['contact_level_raw'],'collision':x['collision_risk_raw']},
                'summary':x['summary'],
                'procedure':' | '.join(p.get('text','').replace('\n',' ') for p in x['procedure']),
                'teacher_prompt':(x['teacher_prompt'] or '').replace('\n',' '),
                'reflection':(x['reflection'] or '').replace('\n',' '),
                'sel_connections':x['sel_connections']
              })
          out='\n'.join(json.dumps(r,ensure_ascii=False,separators=(',',':')) for r in rows)+'\n'
          Path('audit/review_queue.jsonl').write_text(out,encoding='utf-8')
          print('review rows',len(rows))
          PY
      - name: Commit queue
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/review_queue.jsonl
          git commit -m 'Generate temporary semantic review queue'
          git push
