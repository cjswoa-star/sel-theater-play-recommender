name: Build coverage gap audit

on:
  push:
    paths:
      - '.github/workflows/build-gap-audit.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build gap report
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, collections
          cat=json.loads(Path('audit/activity_catalog.json').read_text(encoding='utf-8'))
          tags=sorted(set(t for x in cat for t in x['purpose_tags']))
          out=[]
          for tag in tags:
              r={'tag':tag,'total':0}
              for g in range(1,7):
                  r[f'g{g}']=0; r[f'g{g}_classroom_nomaterial_nocontact']=0
              for x in cat:
                  if tag not in x['purpose_tags']: continue
                  r['total']+=1
                  for g in range(1,7):
                      if x['grade_min']<=g<=x['grade_max']:
                          r[f'g{g}']+=1
                          if ((x.get('space_compatibility') or {}).get('CLASSROOM',0)>=0.5
                              and not x.get('materials_required')
                              and x.get('contact_level')!='LOW'):
                              r[f'g{g}_classroom_nomaterial_nocontact']+=1
              out.append(r)
          out.sort(key=lambda z:(z['g1_classroom_nomaterial_nocontact']+z['g2_classroom_nomaterial_nocontact'], z['total'], z['tag']))
          Path('audit/coverage_gaps.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print('tags',len(out))
          print('lowest lower-grade practical coverage:')
          for r in out[:20]: print(r)
          PY
      - name: Commit report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/coverage_gaps.json
          git commit -m 'Generate temporary coverage gap audit'
          git push
