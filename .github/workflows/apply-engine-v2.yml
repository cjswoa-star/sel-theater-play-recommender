name: Apply recommendation engine V2

on:
  push:
    paths:
      - 'tools/apply_engine_v2.py'
      - 'tools/verify_engine_v2.js'
      - '.github/workflows/apply-engine-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply engine patch
        run: python tools/apply_engine_v2.py
      - name: Verify engine V2
        run: node tools/verify_engine_v2.js
      - name: Remove one-time files
        run: rm -f tools/apply_engine_v2.py tools/verify_engine_v2.js .github/workflows/apply-engine-v2.yml
      - name: Commit production patch
        run: |
          git config user.name "cjswoa-star"
          git config user.email "cjswoa@goedu.kr"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Fix recommendation engine to use curated values"
          git push
