name: Apply final freeze cleanup

on:
  push:
    paths:
      - 'tools/apply_freeze_cleanup.py'
      - '.github/workflows/apply-freeze-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply cleanup
        run: python tools/apply_freeze_cleanup.py
      - name: Verify JavaScript syntax
        run: node --check curation-overrides.js
      - name: Verify final fixes
        run: |
          grep -q 'FINAL_FREEZE_CLEANUP_V1' curation-overrides.js
          grep -q '집중하기.*,.*신체 인식.*,.*문제 해결' curation-overrides.js
          grep -q '같은 쪽 손과 발을 함께 움직였을 때' curation-overrides.js
          grep -q '반대쪽 손과 발을 함께 움직였을 때' curation-overrides.js
          grep -q '상상 물건 릴레이' PDF_SYNC_QUEUE.md
          grep -q '## 7차 잔여 이상치 및 FREEZE 직전 정리' PDF_SYNC_QUEUE.md
      - name: Remove one-time files
        run: rm -f tools/apply_freeze_cleanup.py .github/workflows/apply-freeze-cleanup.yml
      - name: Commit changes
        run: |
          git config user.name "cjswoa-star"
          git config user.email "cjswoa@goedu.kr"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Finalize content freeze cleanup and PDF queue"
          git push
